<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个性化学习助手 - 互动版</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; color: #333; margin: 0; padding: 24px; }
    .container { max-width: 940px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 12px 24px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: #2c3e50; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; align-items: flex-end; }
    .row label { display: flex; flex-direction: column; font-size: 14px; color: #666; }
    select, input { width: 200px; padding: 10px 12px; border-radius: 6px; border: 1px solid #ccd0d5; margin-top: 4px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; background: #3478e5; color: #fff; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #285da1; }
    button:disabled { background: #a5b4cf; cursor: not-allowed; }
    .card { border: 1px solid #e1e4ea; border-radius: 10px; background: #fbfdff; padding: 16px; margin-top: 12px; }
    .question-title { font-weight: 700; margin-bottom: 12px; font-size: 1.1em; }
    .option-item { margin: 8px 0; padding: 8px; border: 1px solid #eee; border-radius: 4px; cursor: pointer; }
    .option-item:hover { background: #f0f7ff; }
    .error { color: #c0392b; padding: 10px; background: #fdf2f2; border-radius: 6px; margin-bottom: 10px; }
    .result-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; }
    .correct { background: #e6fffa; color: #27ae60; border: 1px solid #b2f2bb; }
    .wrong { background: #fff5f5; color: #c0392b; border: 1px solid #feb2b2; }
    .score-banner { text-align: center; font-size: 24px; margin: 20px 0; color: #3478e5; }
  </style>
</head>
<body>
  <div id="app" class="container">
    <h1>个性化学习助手</h1>

    <div class="row">
      <label>选择科目：
        <select v-model="selectedSubjectId">
          <option disabled value="">请选择科目</option>
          <option v-for="subject in subjects" :key="subject.subId" :value="subject.subId">{{ subject.subName }}</option>
        </select>
      </label>
      <label>组卷题数：<input type="number" v-model.number="questionCount" /></label>
      <button :disabled="!selectedSubjectId || questionCount <= 0" @click="generatePaper">生成试卷</button>
    </div>

    <div class="row">
      <label>推荐用户ID:<input type="number" v-model.number="recommendUserId" /></label>
      <label>推荐题数：<input type="number" v-model.number="recommendCount" /></label>
      <button :disabled="recommendUserId <= 0 || recommendCount <= 0" @click="loadRecommendations">获取推荐题目</button>
      <button @click="loadSubjects">刷新科目</button>
    </div>

    <div v-if="errorMessage" class="error">{{ errorMessage }}</div>

    <div v-if="recommendationsLoaded" class="card">
      <h3>推荐结果</h3>
      <div v-if="recommendations.length">
        <p>推荐题目ID序列: <strong>{{ recommendations.join(', ') }}</strong></p>
        <p style="font-size: 0.9em; color: #666;">注：推荐接口目前仅返回ID。若需在线答题，请通过“生成试卷”功能获取详细内容。</p>
      </div>
      <div v-else>当前没有可用的推荐题目。</div>
    </div>

    <div v-if="paper.length" class="card">
      <div v-if="showResult" class="score-banner">
        最终得分：{{ score }} / {{ paper.length }}
      </div>
      
      <div v-for="(question, index) in paper" :key="question.quesId" class="card">
        <div class="question-title">{{ index + 1 }}. {{ question.quesContent }}</div>
        
        <div class="options-group">
          <div v-for="opt in formatOptions(question.quesOptions)" :key="opt" class="option-item">
            <label style="cursor: pointer; display: block;">
              <input 
                type="radio" 
                :name="'q-' + question.quesId" 
                :value="getOptionLetter(opt)" 
                v-model="question.userAnswer"
                :disabled="showResult"
              />
              {{ opt }}
            </label>
          </div>
        </div>

        <div v-if="showResult" :class="['result-box', question.userAnswer === question.quesAnswer ? 'correct' : 'wrong']">
          <span v-if="question.userAnswer === question.quesAnswer">✓ 正确</span>
          <span v-else>✗ 错误。正确答案是：{{ question.quesAnswer }}</span>
        </div>
      </div>

      <div style="margin-top: 20px; text-align: center;">
        <button v-if="!showResult" @click="submitPaper" style="background: #27ae60; padding: 12px 40px;">提交所有答案</button>
        <button v-else @click="resetPaper" style="background: #7f8c8d;">清除当前试卷</button>
      </div>
    </div>

  </div>

  <script>
    const App = {
      data() {
        return {
          subjects: [],
          selectedSubjectId: '',
          questionCount: 5,
          paper: [], // 存储详细题目内容用于展示
          recommendUserId: 1,
          recommendCount: 5,
          recommendations: [], // 仅存储推荐ID
          recommendationsLoaded: false,
          errorMessage: '',
          showResult: false,
          score: 0
        };
      },
      mounted() { this.loadSubjects(); },
      methods: {
        async loadSubjects() {
          try {
            const res = await fetch('/subjects');
            if (!res.ok) throw new Error('无法加载科目');
            this.subjects = await res.json();
            if (this.subjects.length && !this.selectedSubjectId) this.selectedSubjectId = this.subjects[0].subId;
          } catch (err) { this.errorMessage = err.message; }
        },

        async generatePaper() {
          this.errorMessage = '';
          this.showResult = false;
          try {
            const res = await fetch(`/generate?subId=${this.selectedSubjectId}&count=${this.questionCount}`);
            if (!res.ok) throw new Error('生成试卷失败');
            const data = await res.json();
            // 初始化 userAnswer 字段
            this.paper = data.map(q => ({ ...q, userAnswer: '' }));
          } catch (err) { this.errorMessage = err.message; }
        },

        async loadRecommendations() {
          this.errorMessage = '';
          this.recommendationsLoaded = false;
          try {
            const res = await fetch(`/recommend?userId=${this.recommendUserId}&count=${this.recommendCount}`);
            if (!res.ok) throw new Error('获取推荐失败');
            this.recommendations = await res.json();
            this.recommendationsLoaded = true;
          } catch (err) { this.errorMessage = err.message; }
        },

        formatOptions(optionsStr) {
          if (!optionsStr) return [];
          return optionsStr.split('\n').filter(o => o.trim() !== '');
        },

        getOptionLetter(optText) {
          return optText.trim().charAt(0).toUpperCase();
        },

        submitPaper() {
          this.score = this.paper.filter(q => q.userAnswer === q.quesAnswer).length;
          this.showResult = true;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        resetPaper() {
          this.paper = [];
          this.showResult = false;
        }
      }
    };
    Vue.createApp(App).mount('#app');
  </script>
</body>
</html>
